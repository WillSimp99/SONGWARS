<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Nécessaire pour les embeds YouTube : un referrer trop restrictif (ou absent en file://) cause l'erreur 153
     "Erreur de configuration du lecteur vidéo". Cette balise force l'envoi d'un referrer minimal dès que la
     page est servie via http(s) — voir la doc de troubleshooting pour le cas file:// (aucun referrer possible). -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Music Battle — Prototype V1</title>
<style>
  :root{
    --bg:#0e0e10;
    --bg2:#18181b;
    --card:#1f1f23;
    --accent:#9147ff;
    --accent2:#772ce8;
    --p1:#9147ff;
    --p2:#ff8c42;
    --text:#efeff1;
    --muted:#adadb8;
    --success:#00c78c;
    --danger:#ff5c5c;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, rgba(145,71,255,.25), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(255,140,66,.15), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 12px 60px;
  }
  #app{
    width:100%;
    max-width:460px;
  }
  .card{
    background:var(--card);
    border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius);
    padding:22px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  h1,h2,h3{margin:0 0 6px;}
  h1{font-size:22px;}
  h2{font-size:19px;}
  h3{font-size:15px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  p{color:var(--muted); line-height:1.5; margin:0 0 16px; font-size:14.5px;}
  .logo{
    display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:18px;
  }
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
  .logo span{font-weight:800; letter-spacing:.03em; font-size:15px; color:var(--muted);}
  label{display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; font-weight:600;}
  input[type=text], input[type=url], input[type=number], textarea{
    width:100%; background:#0e0e10; border:1px solid rgba(255,255,255,.12); color:var(--text);
    border-radius:10px; padding:11px 12px; font-size:14.5px; font-family:inherit; resize:vertical;
  }
  input:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px 16px; border-radius:12px; border:none;
    font-size:15px; font-weight:700; cursor:pointer; margin-top:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.97);}
  .btn.secondary{ background:transparent; border:1px solid rgba(255,255,255,.18); color:var(--text); }
  .btn.ghost{ background:transparent; color:var(--muted); text-decoration:underline; padding:6px; margin-top:8px; font-weight:500;}
  .btn.small{ width:auto; padding:9px 14px; font-size:13.5px; margin-top:0;}
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .row{display:flex; gap:10px;}
  .row .btn{margin-top:14px;}
  .stepper{display:flex; align-items:center; justify-content:center; gap:18px; margin:14px 0;}
  .stepper button{
    width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.15);
    background:#0e0e10; color:var(--text); font-size:20px; cursor:pointer;
  }
  .stepper .num{font-size:30px; font-weight:800; min-width:40px; text-align:center;}
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:14px 0;
    background:#0e0e10; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.08);}
  .toggle-row .label{font-size:14px; font-weight:600;}
  .toggle-row .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .switch{ position:relative; width:44px; height:26px; flex:none; }
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute; cursor:pointer; inset:0; background:#3a3a3d; border-radius:26px; transition:.2s;}
  .slider:before{ content:""; position:absolute; height:20px; width:20px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s;}
  .switch input:checked + .slider{background:var(--accent);}
  .switch input:checked + .slider:before{ transform:translateX(18px); }
  .chip{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#0e0e10; border:1px solid rgba(255,255,255,.1); border-radius:10px;
    padding:9px 12px; margin-bottom:8px; font-size:14px;
  }
  .chip button{ background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; }
  .theme-empty{ text-align:center; color:var(--muted); font-size:13px; padding:14px 0;}
  .header-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .round-pill{ background:#0e0e10; border:1px solid rgba(255,255,255,.1); padding:5px 12px; border-radius:20px; font-size:12.5px; font-weight:700; color:var(--muted); }
  .score-pill{ display:flex; gap:8px; font-size:13px; font-weight:800; }
  .score-pill .p1{color:var(--p1);} .score-pill .p2{color:var(--p2);}
  .scoreboard{
    display:flex; align-items:stretch; background:#0a0a0d; border:1px solid rgba(255,255,255,.14);
    border-radius:14px; overflow:hidden; margin-bottom:16px; box-shadow:0 8px 22px rgba(0,0,0,.4);
  }
  .scoreboard .side{ flex:1; padding:10px 6px; text-align:center; min-width:0; }
  .scoreboard .side.p1{ background:linear-gradient(180deg, rgba(145,71,255,.24), transparent); }
  .scoreboard .side.p2{ background:linear-gradient(180deg, rgba(255,140,66,.24), transparent); }
  .scoreboard .side .name{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .scoreboard .side .val{ font-size:34px; font-weight:900; line-height:1.15; font-variant-numeric:tabular-nums; }
  .scoreboard .side.p1 .val{ color:var(--p1); }
  .scoreboard .side.p2 .val{ color:var(--p2); }
  .scoreboard .mid{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 12px; background:#141417; flex:none; }
  .scoreboard .mid .vs{ font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.05em; }
  .scoreboard .mid .round{ font-size:10.5px; color:var(--muted); margin-top:3px; white-space:nowrap; }
  .scoreboard-multi{
    display:flex; gap:7px; overflow-x:auto; align-items:center; background:#0a0a0d; border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:10px 10px; margin-bottom:16px; box-shadow:0 8px 22px rgba(0,0,0,.4);
  }
  .scoreboard-multi::-webkit-scrollbar{ height:4px; }
  .scoreboard-multi .round-tag{ flex:none; font-size:11px; color:var(--muted); font-weight:800; padding:0 8px 0 0; border-right:1px solid rgba(255,255,255,.1); white-space:nowrap; }
  .scoreboard-multi .slot{ flex:none; min-width:60px; text-align:center; background:#141417; border-radius:10px; padding:7px 10px; }
  .scoreboard-multi .slot .name{ font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:78px; }
  .scoreboard-multi .slot .val{ font-size:22px; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums; }
  .special-banner{ background:linear-gradient(135deg, rgba(255,92,92,.16), rgba(255,140,66,.16)); border:1px solid rgba(255,140,66,.4);
    border-radius:12px; padding:10px 14px; margin-bottom:14px; font-size:13.5px; font-weight:800; text-align:center; }
  .special-banner .sub{ font-weight:500; font-size:12px; color:var(--muted); margin-top:4px; }
  .rating-grid{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0; }
  .rating-btn{ width:42px; height:42px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:#0e0e10; color:var(--text); font-size:15px; font-weight:800; cursor:pointer; }
  .rating-btn.active{ background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; }
  .wheel-wrap{ position:relative; width:250px; height:250px; margin:10px auto 20px; }
  .wheel-pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent;
    border-top:20px solid var(--text); z-index:3; filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  .wheel{
    width:100%; height:100%; border-radius:50%; position:relative;
    border:6px solid #0e0e10; box-shadow:0 0 0 3px rgba(255,255,255,.08), 0 12px 30px rgba(0,0,0,.5);
    transition:transform 4s cubic-bezier(.17,.67,.16,1);
  }
  .wheel-center{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:46px; height:46px; border-radius:50%; background:var(--card); border:3px solid #0e0e10;
    display:flex; align-items:center; justify-content:center; font-size:18px; z-index:2;
  }
  .theme-reveal{
    text-align:center; font-size:19px; font-weight:800; margin:6px 0 4px;
    background:linear-gradient(135deg,var(--accent),var(--p2)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .handoff{ text-align:center; padding:30px 10px; }
  .handoff .avatar{ font-size:52px; margin-bottom:10px; }
  .player-tag{ display:inline-flex; align-items:center; gap:8px; font-weight:800; padding:5px 12px; border-radius:20px; font-size:13px; margin-bottom:12px;}
  .player-tag.p1{ background:rgba(145,71,255,.15); color:var(--p1); }
  .player-tag.p2{ background:rgba(255,140,66,.15); color:var(--p2); }
  .timer{ text-align:center; font-size:28px; font-weight:800; margin:4px 0 10px; font-variant-numeric:tabular-nums;}
  .timer.warn{ color:var(--danger); }
  .error-text{ color:var(--danger); font-size:12.5px; margin-top:6px; }
  .video-card{ background:#0e0e10; border-radius:14px; padding:12px; margin-bottom:14px; border:1px solid rgba(255,255,255,.08); }
  .video-card .tag{ font-size:12px; font-weight:800; color:var(--muted); margin-bottom:8px; letter-spacing:.04em; }
  .video-card iframe{ width:100%; aspect-ratio:16/9; border:none; border-radius:10px; }
  .vote-tap-btn{ display:block; width:100%; padding:22px 16px; margin-top:10px; border-radius:14px; border:2px solid rgba(255,255,255,.12); background:#0e0e10; color:var(--text); font-size:17px; font-weight:800; cursor:pointer; transition:transform .1s ease, filter .1s ease, opacity .1s ease; }
  .vote-tap-btn:active{ transform:scale(.97); }
  .vote-tap-btn.a{ border-color:var(--p1); }
  .vote-tap-btn.b{ border-color:var(--p2); }
  .vote-tap-btn:disabled{ opacity:.45; }
  .vote-feedback{ text-align:center; font-size:13px; font-weight:700; color:var(--success); min-height:18px; margin:10px 0 0; opacity:0; transition:opacity .2s ease; }
  .vote-count-note{ text-align:center; font-size:12.5px; color:var(--muted); margin:14px 0 0; }
  .playback-progress{ text-align:center; font-size:12.5px; color:var(--muted); font-weight:700; margin:-4px 0 10px; }
  .result-winner{ text-align:center; padding:8px 0 4px; }
  .result-winner .big{ font-size:36px; }
  .result-winner .name{ font-size:18px; font-weight:800; margin-top:4px; }
  .final-score{ display:flex; justify-content:center; align-items:center; gap:18px; margin:18px 0; }
  .final-score .side{ text-align:center; }
  .final-score .side .val{ font-size:38px; font-weight:900; }
  .final-score .vs{ color:var(--muted); font-weight:700; }
  .recap-item{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding:7px 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .recap-item b{ color:var(--text); }
  .footer-note{ text-align:center; font-size:11.5px; color:#5b5b60; margin-top:16px; }

  details.settings{ margin-top:16px; background:#0e0e10; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:4px 14px; }
  details.settings summary{ cursor:pointer; padding:10px 0; font-size:13.5px; font-weight:700; color:var(--muted); list-style:none; }
  details.settings summary::-webkit-details-marker{ display:none; }
  details.settings summary:before{ content:'⚙️ '; }
  details.settings[open] summary{ margin-bottom:2px; }
  .settings-hint{ font-size:12px; color:var(--muted); margin:0 0 10px; line-height:1.5; }

  .seg-toggle{ display:flex; gap:6px; background:#0e0e10; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:4px; margin:10px 0; }
  .seg-btn{ flex:1; text-align:center; padding:9px 8px; border-radius:9px; font-size:13.5px; font-weight:700; cursor:pointer; color:var(--muted); background:transparent; border:none; }
  .seg-btn.active{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; }

  .search-status{ font-size:13px; color:var(--muted); padding:8px 2px; }
  .search-list{ margin-top:8px; max-height:260px; overflow-y:auto; }
  .search-item{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; cursor:pointer; margin-bottom:6px; background:#0e0e10; border:1px solid rgba(255,255,255,.06); }
  .search-item:hover{ border-color:var(--accent); }
  .search-item.selected{ border-color:var(--success); background:rgba(0,199,140,.08); }
  select{
    width:100%; background:#0e0e10; border:1px solid rgba(255,255,255,.12); color:var(--text);
    border-radius:10px; padding:11px 12px; font-size:14.5px; font-family:inherit;
  }
  select:focus{ outline:none; border-color:var(--accent); }
  .search-item img{ width:48px; height:48px; object-fit:cover; border-radius:6px; flex:none; background:#000; }
  .search-item .meta{ min-width:0; }
  .search-item .meta .t{ font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .search-item .meta .s{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .selected-track{ background:#0e0e10; border:1px solid var(--success); border-radius:12px; padding:12px; margin-top:10px; }
  .selected-track .row-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .selected-track .row-top img{ width:44px; height:44px; object-fit:cover; border-radius:6px; }
  .selected-track .row-top .t{ font-size:14px; font-weight:700; }
  .selected-track .row-top .s{ font-size:12px; color:var(--muted); }
  .selected-track iframe{ width:100%; border:none; border-radius:8px; margin-top:6px; }

  .video-card.spotify iframe{ aspect-ratio:auto; height:152px; }

  .yt-custom-player{ width:100%; }
  .yt-player-frame{ width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#000; }
  .yt-controls{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .yt-playpause{ flex:none; width:38px; height:38px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .yt-progress-wrap{ flex:1; height:6px; background:#2a2a2f; border-radius:6px; cursor:pointer; overflow:hidden; }
  .yt-progress-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:6px; }
  .yt-time{ flex:none; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:74px; text-align:right; }
  .sp-art{ width:100%; aspect-ratio:16/9; border-radius:10px; background:linear-gradient(135deg,#1DB95433,#1DB95411); display:flex; align-items:center; justify-content:center; font-size:44px; }

  .bracket-wrap{ overflow-x:auto; max-width:100%; margin:10px 0 6px; padding:4px 0 12px; }
  .bracket-content{ position:relative; display:flex; align-items:stretch; width:max-content; }
  .bracket-svg{ position:absolute; top:0; left:0; pointer-events:none; z-index:0; }
  .bracket-round-col{ display:flex; flex-direction:column; justify-content:space-around; min-width:152px; flex:none; padding:0 16px; position:relative; z-index:1; }
  .bracket-round-label{ text-align:center; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .bracket-match-box{ background:#1c1c20; border-radius:10px; overflow:hidden; margin:6px 0; min-width:150px; }
  .bracket-match-box.next{ box-shadow:0 0 0 1.5px var(--accent); }
  .bracket-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; }
  .bracket-row + .bracket-row{ border-top:1px solid rgba(255,255,255,.07); }
  .bracket-row .name{ font-size:12.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bracket-row .status{ font-size:12px; flex:none; color:var(--muted); }
  .bracket-row.winner .name{ font-weight:800; }
  .bracket-row.loser .name{ color:var(--muted); }
  .bracket-row.pending .name{ color:var(--muted); font-style:italic; }
  .bracket-match-box .launch-row{ padding:0 8px 8px; }
  .bracket-match-box .launch-row .btn{ margin:0; }

  .nav-bar{ width:100%; max-width:460px; margin:0 0 8px; display:flex; }
  .nav-btn{ background:none; border:none; color:var(--muted); font-size:13px; font-weight:700; cursor:pointer; padding:6px 4px; }
  .nav-btn:hover{ color:var(--text); }
  .nav-btn.quit{ color:var(--danger); margin-left:auto; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const PALETTE = ['#9147ff','#ff8c42','#00c78c','#ff5c5c','#3ea6ff','#ffd166','#c77dff','#4dd0e1'];

const state = {
  screen:'modeSelect',
  gameMode:'battle',
  party:{ participants:[], artistMode:false, rounds:[], bracketSize:0, championIdx:null, currentMatch:null },
  king:{ kingIdx:null, participants:[], queue:[], streak:0, history:[], roundsToWinHill:10, matchFormat:'bo1' },
  battle:{ players:[], scores:[], submitOrder:[], submitStep:0, submissions:[], playbackOrder:[], playbackIndex:0, ballot:[], ballotLocked:false, roundPoints:[], totalBallots:0, hostPickOpen:false },
  chain:{ players:[], log:[], ratingSelected:null },
  chainLinkDraft:'',
  p1Name:'Joueur 1', p2Name:'Joueur 2',
  totalRounds:5,
  wheelEnabled:false,
  themesPool:[],
  themesLibrary:[],
  homeSettingsOpen:false,
  themesLibraryBulkOpen:false,
  themesLibraryBulkDraft:'',
  timerEnabled:false, timerSeconds:90,
  timerRemaining:0, timerHandle:null,
  specialRoundsCount:0,
  specialRoundsPlan:[],
  currentSpecialEffect:null,
  round:1,
  scoreP1:0, scoreP2:0,
  currentTheme:null,
  wheelRotation:0,
  submitStage:'p1',
  submissions:{p1:null, p2:null},
  order:['p1','p2'],
  votes:{A:0,B:0},
  playbackIndex:0,
  hostPickOpen:false,
  history:[],
  apiKeys:{youtube:'', spotifyId:'', spotifySecret:''},
  localLibrary:[],
  localLibraryQuery:'',
  gameSettingsOpen:false,
  spotifyToken:null, spotifyTokenExpiry:0,
  spotifyAuth:{accessToken:null, refreshToken:null, expiresAt:0},
  submitSource:'youtube',
  submitMode:'search',
  searchQuery:'',
  searchResults:[],
  searchLoading:false,
  searchError:'',
  selectedTrack:null
};
let searchDebounceHandle=null;
let ytApiPromise=null;
let ytPlayer=null;
let ytProgressHandle=null;
let spSdkPromise=null;
let spPlayer=null;
let spDeviceId=null;
let spProgressHandle=null;
let spLastState=null;
let spWasNearEnd=false;
let spCurrentTrackId=null;

const app = document.getElementById('app');
function render(){
  const map = {
    modeSelect: renderModeSelect,
    battleSetup: renderBattleSetup,
    partySetup: renderPartySetup,
    bracketView: renderBracketView,
    tournamentChampion: renderTournamentChampion,
    kingSetup: renderKingSetup,
    kingView: renderKingView,
    kingChampion: renderKingChampion,
    handoff: renderHandoff,
    submit: renderSubmit,
    battleHandoff: renderBattleHandoff,
    battleSubmit: renderBattleSubmit,
    battlePlayback: renderBattlePlayback,
    battleVote: renderBattleVote,
    battleResult: renderBattleResult,
    battleGameOver: renderBattleGameOver,
    chainSetup: renderChainSetup,
    chainHandoff: renderChainHandoff,
    chainSubmit: renderChainSubmit,
    chainClosing: renderChainClosing,
    chainGameOver: renderChainGameOver,
    wheelSpin: renderWheelSpin,
    playback: renderPlayback,
    vote: renderVote,
    result: renderResult,
    gameover: renderGameOver
  };
  app.innerHTML = logo() + renderNav() + (map[state.screen] ? map[state.screen]() : '');
  afterRender();
}
function logo(){
  return `<div class="logo"><div class="dot"></div><span>MUSIC BATTLE — PROTOTYPE V1</span></div>`;
}

/* ---------- NAVIGATION (retour / quitter) ---------- */
const BACK_TARGETS = {
  battleSetup:'modeSelect',
  partySetup:'modeSelect',
  kingSetup:'modeSelect',
  chainSetup:'modeSelect'
};
const QUIT_SCREENS = ['wheelSpin','handoff','submit','playback','vote','result','bracketView','kingView',

function renderLibraryChipsHtml(){

function removeFromLibrary(i){ state.localLibrary.splice(i,1); render(); }

/* ---------- RÉGLAGES DE PARTIE (partagé entre les 3 modes) ---------- */

function adjustRounds(delta){

}
function adjustHillTarget(delta){

  render();
}
function setKingMatchFormat(fmt){

/* ---------- ROUNDS SPÉCIAUX ("cartes malédiction") ---------- */
const SPECIAL_EFFECTS = [
  { key:'lightning', icon:'⚡', label:'Chrono Éclair', desc:"Chrono de soumission forcé à 30 secondes, même s'il est désactivé.", isAvailable: ()=>true },
  { key:'double', icon:'💰', label:'Points Doublés', desc:"Le gagnant du round remporte 2 points au lieu d'1.", isAvailable: ()=>true },
  { key:'steal', icon:'🥷', label:'Vol de Point', desc:"Le gagnant vole en plus 1 point à son adversaire direct.", isAvailable: ()=>true },
  { key:'theme', icon:'🔮', label:'Thème Mystère', desc:"Un thème surprise est imposé pour ce round, même si la roue est désactivée.", isAvailable: (s)=> !s.wheelEnabled && s.themesLibrary.length>=1 },
  { key:'noveto', icon:'🙅', label:'Pas de Veto', desc:"L'hôte ne peut pas trancher directement ce round : seul le vote du public compte.", isAvailable: ()=>true }
];
// Le round 1 n'est jamais tiré comme round spécial (on laisse toujours un round "normal" pour démarrer la partie
// tranquillement) — le max sélectionnable dans les réglages et le pool de tirage en tiennent compte tous les deux.
function specialRoundsMax(){
  if(state.gameMode==='king') return Math.max(0, (state.king.matchFormat==='bo3' ? 3 : 1) - 1);
  return Math.max(0, Math.min(5, state.totalRounds - 1));
}
function adjustSpecialRounds(delta){
  const max = specialRoundsMax();
  state.specialRoundsCount = Math.min(max, Math.max(0, (state.specialRoundsCount||0)+delta));
  render();
}
function computeSpecialRoundsPlan(total){
  const eligibleRounds = [...Array(total).keys()].map(i=>i+1).filter(r=>r>1);
  const n = Math.max(0, Math.min(state.specialRoundsCount||0, eligibleRounds.length));
  state.specialRoundsPlan = shuffleArr(eligibleRounds).slice(0, n);
}
function pickSpecialEffect(){
  const pool = SPECIAL_EFFECTS.filter(e=>e.isAvailable(state));
  return pool[Math.floor(Math.random()*pool.length)];
}
function specialRoundBannerHtml(){
  const e = state.currentSpecialEffect;
  if(!e) return '';
  return `<div class="special-banner">🔥 Round spécial — ${e.icon} ${e.label}<div class="sub">${e.desc}</div></div>`;
}
function isTimerActiveThisRound(){
  return state.timerEnabled || (state.currentSpecialEffect && state.currentSpecialEffect.key==='lightning');
}
function effectiveTimerSeconds(){
  return (state.currentSpecialEffect && state.currentSpecialEffect.key==='lightning') ? 30 : state.timerSeconds;
}
function toggleTimerOption(checked){
  state.timerEnabled = checked;
  render();
}
function setGameMusicSource(src){
  state.submitSource = src;
  render();
}

/* ---------- BATTLE ROYALE (2 à 10 joueurs, vote classé top 3) ---------- */
function renderBattleSetup(){

  return `<div class="card">

function addBattlePlayer(){
  if(state.battle.players.length>=10) return;

function removeBattlePlayer(i){ state.battle.players.splice(i,1); render(); }
function startBattle(){
  const b = state.battle;
  if(b.players.length<2) return;
  b.scores = b.players.map(()=>0);

  if(state.wheelEnabled) primeThemesPoolFromLibrary();

}
function beginBattleRound(){
  const b = state.battle;
  state.currentTheme = null;
  state.currentSpecialEffect = (state.specialRoundsPlan||[]).includes(state.round) ? pickSpecialEffect() : null;
  if(state.currentSpecialEffect && state.currentSpecialEffect.key==='theme' && state.themesLibrary.length){
    state.currentTheme = state.themesLibrary[Math.floor(Math.random()*state.themesLibrary.length)];
  }
  b.submissions = b.players.map(()=>null);
  b.submitOrder = b.players.map((_,i)=>i);
  b.submitStep = 0;
  b.playbackOrder = [];
  b.playbackIndex = 0;
  b.ballot = [];
  b.ballotLocked = false;
  b.roundPoints = b.players.map(()=>0);
  b.totalBallots = 0;
  b.hostPickOpen = false;
  state.screen = state.wheelEnabled && state.themesPool.length>=2 ? 'wheelSpin' : 'battleHandoff';
  render();
}

/* ---------- BATTLE ROYALE — soumission (tour par tour, en aveugle) ---------- */
function renderBattleHandoff(){

    ${renderSubmissionFormBodyHtml('submitBattleSong')}

function submitBattleSong(){
  const b = state.battle;
  const playerIdx = b.submitOrder[b.submitStep];

  if(state.selectedTrack){
    const t = state.selectedTrack;
    stopTimer();
    b.submissions[playerIdx] = {source:t.source, id:t.id, url:null, title:t.title, thumbnail:t.thumbnail};
    advanceAfterBattleSubmit();
    return;
  }

  const urlInput = document.getElementById('trackUrl');
  const url = urlInput ? urlInput.value.trim() : '';
  const src = state.submitSource;
  const id = src==='youtube' ? extractYouTubeId(url) : extractSpotifyId(url);
  if(!id){
    const err = document.getElementById('urlError');
    if(err) err.style.display='block';
    return;
  }
  stopTimer();
  b.submissions[playerIdx] = {source:src, id, url, title:null, thumbnail:null};
  fetchTitle(src, url).then(title=>{
    if(b.submissions[playerIdx]) b.submissions[playerIdx].title = title;
  });
  advanceAfterBattleSubmit();
}
function advanceAfterBattleSubmit(){
  const b = state.battle;
  b.submitStep++;
  if(b.submitStep < b.submitOrder.length){
    state.screen='battleHandoff';
  } else {
    b.playbackOrder = shuffleArr(b.players.map((_,i)=>i));
    b.playbackIndex = 0;
    state.screen='battlePlayback';
  }
  render();
}
function forfeitCurrentBattlePlayer(){
  const b = state.battle;
  const playerIdx = b.submitOrder[b.submitStep];
  b.submissions[playerIdx] = {source:null, id:null, url:null, title:'Forfait', thumbnail:null};

}

}
function nextBattlePlaybackTrack(){ state.battle.playbackIndex = (state.battle.playbackIndex||0)+1; render(); }
function goToBattleVote(){ state.screen='battleVote'; render(); }

/* ---------- BATTLE ROYALE — vote classé (top 3 : 3/2/1 points) ---------- */
function renderBattleVote(){
  const b = state.battle;
  const order = b.playbackOrder;
  const ballotSize = Math.min(3, order.length);
  const rankLabels = ['🥇 1er','🥈 2e','🥉 3e'];
  const rows = order.map((playerIdx,i)=>{
    const label = String.fromCharCode(65+i);
    const sub = b.submissions[playerIdx];
    const rankPos = b.ballot.indexOf(i);
    return `<div class="search-item ${rankPos>=0?'selected':''}" onclick="tapBattleVote(${i})">
      <div class="meta"><div class="t">Morceau ${label}</div>${sub && sub.title ? `<div class="s">${escapeHtml(sub.title)}</div>` : ''}</div>
      ${rankPos>=0 ? `<span style="font-weight:800; font-size:13px; flex:none;">${rankLabels[rankPos]}</span>` : ''}
    </div>`;
  }).join('');
  const noVeto = state.currentSpecialEffect && state.currentSpecialEffect.key==='noveto';
  return `<div class="card">
    ${battleHeaderBar()}
    ${specialRoundBannerHtml()}
    <h2>Vote — ton top ${ballotSize}</h2>
    <p>Fais passer le téléphone : chaque personne clique dans l'ordre sur son ${ballotSize===3?'1er, 2e puis 3e':'1er puis 2e'} morceau préféré (pas le sien !). Le classement se valide automatiquement une fois complet.</p>
    <div class="search-list">${rows}</div>
    <button class="btn secondary small" onclick="resetBattleBallot()">Réinitialiser mon choix</button>
    <div class="vote-feedback" id="voteFeedback"></div>

    <div class="vote-count-note">🗳️ ${b.totalBallots} vote${b.totalBallots>1?'s':''} enregistré${b.totalBallots>1?'s':''} au total — détail caché jusqu'à la clôture</div>

    <button class="btn" onclick="closeBattleVote()">Clôturer le vote et révéler le résultat</button>

    ${noVeto ? '' : `<details class="settings" ${b.hostPickOpen?'open':''} ontoggle="state.battle.hostPickOpen=this.open;">
      <summary>👑 Option hôte — trancher directement</summary>
      <p class="settings-hint">Choisis toi-même le podium du round. Ça clôture le vote immédiatement (remplace les votes déjà comptés).</p>
      ${renderHostBattlePickerHtml()}
    </details>`}
  </div>`;
}
function tapBattleVote(slotIndex){
  const b = state.battle;
  if(b.ballotLocked) return;
  const ballotSize = Math.min(3, b.playbackOrder.length);
  if(b.ballot.includes(slotIndex)){
    b.ballot = b.ballot.filter(x=>x!==slotIndex);
    render();
    return;
  }
  if(b.ballot.length>=ballotSize) return;
  b.ballot.push(slotIndex);
  render();
  if(b.ballot.length===ballotSize){
    b.ballotLocked = true;
    const points = ballotSize===3 ? [3,2,1] : [3,2];
    b.ballot.forEach((slot,rank)=>{
      const playerIdx = b.playbackOrder[slot];
      b.roundPoints[playerIdx] += points[rank];
    });
    b.totalBallots++;
    const fb = document.getElementById('voteFeedback');
    if(fb){ fb.textContent = '✓ Merci ! Passe le téléphone à la personne suivante.'; fb.style.opacity = '1'; }
    setTimeout(()=>{ b.ballot=[]; b.ballotLocked=false; render(); }, 700);
  }
}
function resetBattleBallot(){
  if(state.battle.ballotLocked) return;
  state.battle.ballot=[];
  render();
}
function renderHostBattlePickerHtml(){
  const b = state.battle;
  const options = b.playbackOrder.map((playerIdx,i)=>{
    const label = String.fromCharCode(65+i);
    const sub = b.submissions[playerIdx];
    const title = sub && sub.title ? ' — '+sub.title : '';
    return `<option value="${i}">Morceau ${label}${escapeHtml(title)}</option>`;
  }).join('');
  const ballotSize = Math.min(3, b.playbackOrder.length);
  const labels = ['1ère place (3 pts)','2e place (2 pts)','3e place (1 pt)'].slice(0, ballotSize);
  const selects = labels.map((lbl,i)=>`
    <label>${lbl}</label>
    <select id="hostPodium${i}"><option value="">—</option>${options}</select>
  `).join('');
  return `${selects}<button class="btn secondary" style="margin-top:10px;" onclick="hostPickBattlePodium()">Valider le podium</button>`;
}
function hostPickBattlePodium(){
  const b = state.battle;
  const ballotSize = Math.min(3, b.playbackOrder.length);
  const picks = [];
  for(let i=0;i<ballotSize;i++){
    const sel = document.getElementById('hostPodium'+i);
    const v = sel ? sel.value : '';
    if(v===''){ alert('Choisis un morceau pour chaque place du podium.'); return; }
    picks.push(parseInt(v,10));
  }
  if(new Set(picks).size !== picks.length){ alert('Chaque place du podium doit avoir un morceau différent.'); return; }
  b.roundPoints = b.players.map(()=>0);
  const points = ballotSize===3 ? [3,2,1] : [3,2];
  picks.forEach((slot,rank)=>{
    const playerIdx = b.playbackOrder[slot];
    b.roundPoints[playerIdx] += points[rank];
  });
  closeBattleVote();
}
function closeBattleVote(){ state.screen='battleResult'; render(); }

/* ---------- BATTLE ROYALE — résultat du round ---------- */
function renderBattleResult(){
  const b = state.battle;
  const maxPoints = Math.max(...b.roundPoints);
  const winners = b.roundPoints.map((p,i)=>p===maxPoints?i:-1).filter(i=>i>=0);
  const isTie = maxPoints===0 || winners.length>1;
  const effectKey = state.currentSpecialEffect ? state.currentSpecialEffect.key : null;
  const gainedPoints = effectKey==='double' ? 2 : 1;
  if(!isTie){
    b.scores[winners[0]] += gainedPoints;
    if(effectKey==='steal'){
      const sortedIdx = b.roundPoints.map((p,i)=>({i,p})).sort((x,y)=>y.p-x.p);
      const runnerUp = sortedIdx.find(x=>x.i!==winners[0]);
      if(runnerUp) b.scores[runnerUp.i] = Math.max(0, b.scores[runnerUp.i]-1);
    }
  }
  const winnerName = !isTie ? b.players[winners[0]].name
    : (maxPoints===0 ? 'Aucun vote exploitable — le round va être rejoué' : 'Égalité parfaite — le round va être rejoué');

  const ranked = b.playbackOrder.map((playerIdx,slot)=>({playerIdx, slot, points:b.roundPoints[playerIdx]}))
    .sort((x,y)=>y.points-x.points);
  const reveals = ranked.map(r=>{
    const label = String.fromCharCode(65+r.slot);
    const sub = b.submissions[r.playerIdx];
    const won = !isTie && r.playerIdx===winners[0];
    return `<div class="video-card" style="${won?'border-color:var(--success);':''}">
      <div class="tag">Morceau ${label} — ${escapeHtml(b.players[r.playerIdx].name)} ${won?'🏆':''}</div>
      <div style="font-weight:700; font-size:14px;">${escapeHtml(sub && sub.title ? sub.title : (sub && sub.url ? '(titre en cours de récupération...)' : 'Aucune soumission'))}</div>
      <div style="font-size:12.5px; color:var(--muted); margin-top:4px;">${r.points} point${r.points>1?'s':''} ce round</div>
    </div>`;
  }).join('');

  const majority = Math.ceil(state.totalRounds/2);
  const gameDecided = !isTie && b.scores[winners[0]]>=majority;
  const isLastRound = !isTie && state.round>=state.totalRounds;

  if(!isTie) state.history.push({round:state.round, theme:state.currentTheme, winner:winnerName});

  const outcome = isTie ? 'tie' : ((gameDecided || isLastRound) ? 'over' : 'continue');
  const btnLabel = isTie ? '🔁 Rejouer ce round' : ((gameDecided || isLastRound) ? 'Voir le résultat final' : 'Round suivant');

  return `<div class="card">
    ${battleHeaderBar()}
    ${specialRoundBannerHtml()}
    <div class="result-winner">
      <div class="big">${!isTie?'🏆':'🤝'}</div>
      <div class="name">${escapeHtml(winnerName)}</div>
    </div>
    ${reveals}
    <button class="btn" onclick="afterBattleResult('${outcome}')">${btnLabel}</button>
  </div>`;
}
function afterBattleResult(outcome){
  if(outcome==='tie'){ beginBattleRound(); return; }
  if(outcome==='over'){ state.screen='battleGameOver'; render(); return; }
  state.round++;
  beginBattleRound();
}
function renderBattleGameOver(){
  const b = state.battle;
  const maxScore = Math.max(...b.scores);
  const champions = b.players.filter((p,i)=>b.scores[i]===maxScore).map(p=>p.name);
  const winnerName = champions.length>1 ? champions.join(' & ')+' (égalité)' : champions[0];
  const leaderboard = b.players.map((p,i)=>({name:p.name, score:b.scores[i]}))
    .sort((x,y)=>y.score-x.score)
    .map((row,i)=>`<div class="recap-item"><span>${i+1}. ${escapeHtml(row.name)}</span><b>${row.score} pt${row.score>1?'s':''}</b></div>`).join('');
  const recap = state.history.map(h=>`
    <div class="recap-item"><span>Round ${h.round}${h.theme?' — '+escapeHtml(h.theme):''}</span><b>${escapeHtml(h.winner)}</b></div>
  `).join('');
  return `<div class="card">
    <h1 style="text-align:center;">🏆 ${escapeHtml(winnerName)} remporte la battle royale !</h1>
    <h3>Classement final</h3>
    ${leaderboard}
    <h3 style="margin-top:16px;">Récap des rounds</h3>
    ${recap}
    <button class="btn" onclick="resetGame()">Rejouer</button>
  </div>`;
}

function addChainPlayer(){

function renderChainSubmit(){

function submitChainSong(){
  const c = state.chain;
  const idx = chainCurrentIdx();
  const prevEntry = c.log.length ? c.log[c.log.length-1] : null;
  const linkInput = document.getElementById('chainLinkInput');
  const link = prevEntry ? (linkInput ? linkInput.value.trim() : '') : '';
  if(prevEntry && !link){

    return;
  }

  if(state.selectedTrack){
    const t = state.selectedTrack;
    stopTimer();
    c.log.push({playerIdx:idx, sub:{source:t.source, id:t.id, url:null, title:t.title, thumbnail:t.thumbnail}, link, rating:null});
    advanceAfterChainSubmit();

  const urlInput = document.getElementById('trackUrl');

  if(!id){
    const err = document.getElementById('urlError');
    if(err) err.style.display='block';

  const entry = {playerIdx:idx, sub:{source:src, id, url, title:null, thumbnail:null}, link, rating:null};

function renderChainClosing(){
  const c = state.chain;

  const raterName = c.players[raterIdx].name;

function confirmClosingRating(){
  const c = state.chain;

  c.ratingSelected = null;
  state.screen = 'chainGameOver';

function chainAverage(playerIdx){
  const entries = state.chain.log.filter(e=>e.playerIdx===playerIdx && e.rating!=null);
  if(!entries.length) return null;
  return entries.reduce((s,e)=>s+e.rating,0)/entries.length;
}
function renderChainGameOver(){
  const c = state.chain;
  const rows = c.players.map((p,i)=>({name:p.name, avg:chainAverage(i)}))
    .sort((a,b)=>(b.avg==null?-1:b.avg)-(a.avg==null?-1:a.avg));
  const best = rows.find(r=>r.avg!=null);
  const champions = best ? rows.filter(r=>r.avg===best.avg).map(r=>r.name) : [];
  const winnerName = champions.length>1 ? champions.join(' & ')+' (égalité)' : (champions[0] || null);
  const leaderboard = rows.map((r,i)=>`<div class="recap-item"><span>${i+1}. ${escapeHtml(r.name)}</span><b>${r.avg==null?'—':r.avg.toFixed(1)+'/10'}</b></div>`).join('');
  const chainHistory = c.log.map((e,i)=>`

  `).join('');
  return `<div class="card">

  </div>`;
}

/* ---------- BIBLIOTHÈQUE DE THÈMES DE LA ROUE (écran d'accueil, sauvegardée) ---------- */
const THEMES_MAX = 50;
function renderThemesLibraryChipsHtml(){
  return state.themesLibrary.map((t,i)=>`
    <div class="chip"><span>${escapeHtml(t)}</span><button onclick="removeLibraryTheme(${i})">✕</button></div>
  `).join('') || `<div class="theme-empty">Aucun thème ajouté pour l'instant</div>`;
}
function addLibraryTheme(){
  if(state.themesLibrary.length >= THEMES_MAX) return;
  const input = document.getElementById('themeLibInput');
  const val = input.value.trim();
  if(val && !state.themesLibrary.includes(val)){
    state.themesLibrary.push(val);
    saveThemesLibrary();
    input.value = '';
  }
  render();
}
function removeLibraryTheme(i){ state.themesLibrary.splice(i,1); saveThemesLibrary(); render(); }
function importLibraryThemes(){
  const textarea = document.getElementById('themeLibBulkInput');
  const raw = textarea.value;
  let parts = raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1){
    parts = raw.split(',').map(s=>s.trim()).filter(Boolean);
  }
  let added = 0, skippedDupe = 0, skippedMax = 0;
  for(const p of parts){
    if(state.themesLibrary.length >= THEMES_MAX){ skippedMax++; continue; }
    if(state.themesLibrary.includes(p)){ skippedDupe++; continue; }
    state.themesLibrary.push(p);
    added++;
  }
  state.themesLibraryBulkDraft = '';
  saveThemesLibrary();
  const msgs = [];
  if(added) msgs.push(`${added} thème${added>1?'s':''} ajouté${added>1?'s':''}`);
  if(skippedDupe) msgs.push(`${skippedDupe} doublon${skippedDupe>1?'s':''} ignoré${skippedDupe>1?'s':''}`);
  if(skippedMax) msgs.push(`${skippedMax} ignoré${skippedMax>1?'s':''} (limite de ${THEMES_MAX} atteinte)`);
  render();
  const box = document.getElementById('importLibMsg');
  if(box) box.innerHTML = `<div class="settings-hint" style="margin-top:8px;">${msgs.join(' — ') || 'Aucun thème valide trouvé.'}</div>`;
}
// Copie la bibliothèque sauvegardée dans le pool de travail de la partie en cours (la roue "consomme"
// les thèmes au fil des rounds sans jamais toucher à la bibliothèque persistée).
function primeThemesPoolFromLibrary(){
  state.themesPool = shuffleArr(state.themesLibrary);
}

/* ---------- MODE SOIRÉE (hôte, plusieurs participants) ---------- */
function renderPartySetup(){
  const p = state.party;
  const chips = p.participants.map((person,i)=>`
    <div class="chip"><span>${escapeHtml(person.name)}${p.artistMode && person.artist ? ' — 🎤 '+escapeHtml(person.artist) : ''}</span><button onclick="removeParticipant(${i})">✕</button></div>
  `).join('') || `<div class="theme-empty">Aucun participant ajouté pour l'instant</div>`;
  const artistMissing = p.artistMode && p.participants.some(x=>!x.artist);

  return `<div class="card">
    <h1>Mode Soirée — configuration</h1>
    <p>Toi (l'hôte) rentres le nom de chaque participant, puis tu géreras leurs soumissions à tour de rôle pendant la partie — pratique pour jouer à plusieurs sans que tout le monde ait besoin d'un appareil.</p>

    <label>Nom du participant</label>
    <input type="text" id="partyNameInput" placeholder="Ex : Louis" onkeydown="if(event.key==='Enter'){event.preventDefault();addParticipant();}">
    ${p.artistMode ? `<label>Artiste attribué</label><input type="text" id="partyArtistInput" placeholder="Ex : Daft Punk" onkeydown="if(event.key==='Enter'){event.preventDefault();addParticipant();}">` : ''}
    <button class="btn secondary" onclick="addParticipant()">+ Ajouter le participant</button>

    <div style="margin-top:14px;">${chips}</div>

    ${renderGameSettingsDetails({
      roundsLabel:'Rounds par match',
      wheelDisabled:p.artistMode,
      wheelSub: p.artistMode?'Désactivée en mode tournoi par artiste':'Tire une contrainte au début de chaque round',
      partyArtist:true
    })}

    <button class="btn" ${p.participants.length<2 || artistMissing ?'disabled':''} onclick="generateBracket()">Générer la grille (${p.participants.length} participants)</button>
    ${p.participants.length<2?'<div class="error-text">Ajoute au moins 2 participants.</div>':''}
    ${artistMissing?'<div class="error-text">Chaque participant doit avoir un artiste attribué en mode tournoi par artiste.</div>':''}

}
function addParticipant(){
  const nameInput = document.getElementById('partyNameInput');
  const name = nameInput.value.trim();
  if(!name) return;
  let artist = '';
  if(state.party.artistMode){
    const artistInput = document.getElementById('partyArtistInput');
    artist = artistInput ? artistInput.value.trim() : '';
  }
  state.party.participants.push({name, artist});
  render();
}
function removeParticipant(i){ state.party.participants.splice(i,1); render(); }
function toggleArtistMode(checked){
  state.party.artistMode = checked;
  if(checked) state.wheelEnabled = false;
  render();
}
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function generateBracket(){
  const p = state.party;
  if(p.participants.length<2) return;
  if(p.artistMode && p.participants.some(x=>!x.artist)) return;
  buildBracket();
  if(state.wheelEnabled && !p.artistMode) primeThemesPoolFromLibrary();
  state.screen='bracketView';
  render();
}
function buildBracket(){
  const p = state.party;
  const n = p.participants.length;
  const size = Math.pow(2, Math.ceil(Math.log2(n)));
  const byesCount = size - n;
  const shuffledIdx = shuffleArr([...Array(n).keys()]);
  let slots = shuffleArr([...shuffledIdx, ...Array(byesCount).fill(null)]);
  const round0 = [];
  for(let i=0;i<slots.length;i+=2){
    const a = slots[i], b = slots[i+1];
    const bye = (a===null || b===null);
    round0.push({a, b, winner: bye ? (a===null ? b : a) : null, played: bye});
  }
  p.rounds = [round0];
  p.bracketSize = size;
  p.championIdx = null;
  p.currentMatch = null;
  advancePartyBracket();
}
function advancePartyBracket(){
  const p = state.party;
  let last = p.rounds[p.rounds.length-1];
  while(last.every(m=>m.played) && last.length>1){
    const winners = last.map(m=>m.winner);
    const next = [];
    for(let i=0;i<winners.length;i+=2){
      next.push({a:winners[i], b:winners[i+1], winner:null, played:false});
    }
    p.rounds.push(next);
    last = next;
  }
  if(last.length===1 && last[0].played){
    p.championIdx = last[0].winner;
  }
}
function findNextMatch(){
  const rounds = state.party.rounds;
  for(let r=0;r<rounds.length;r++){
    for(let m=0;m<rounds[r].length;m++){
      const match = rounds[r][m];
      if(!match.played && match.a!=null && match.b!=null) return {r,m};
    }
  }
  return null;
}
function launchMatch(r,m){
  const match = state.party.rounds[r][m];
  state.party.currentMatch = {r,m};
  state.p1Name = state.party.participants[match.a].name;
  state.p2Name = state.party.participants[match.b].name;
  state.scoreP1=0; state.scoreP2=0; state.round=1; state.history=[];
  computeSpecialRoundsPlan(state.totalRounds);
  beginRound();
}
function currentMatchArtists(){
  if(state.gameMode!=='party' || !state.party.artistMode || !state.party.currentMatch) return null;
  const {r,m} = state.party.currentMatch;
  const match = state.party.rounds[r][m];
  return { p1: state.party.participants[match.a].artist, p2: state.party.participants[match.b].artist };
}
function renderBracketView(){
  const p = state.party;
  const nextMatch = findNextMatch();
  const totalRoundsCount = Math.log2(p.bracketSize);
  let roundsHtml = '';
  for(let ri=0; ri<totalRoundsCount; ri++){
    const matchesInRound = p.bracketSize / Math.pow(2, ri+1);
    let boxes = '';
    for(let mi=0; mi<matchesInRound; mi++){
      const match = (p.rounds[ri] && p.rounds[ri][mi]) || null;
      boxes += renderBracketBox(ri, mi, match, nextMatch);
    }
    roundsHtml += `<div class="bracket-round-col" data-round="${ri}">
      <div class="bracket-round-label">Round ${ri+1}</div>
      ${boxes}
    </div>`;
  }
  const champ = p.championIdx!=null ? p.participants[p.championIdx].name : null;
  roundsHtml += `<div class="bracket-round-col" data-round="winner">
    <div class="bracket-round-label">Winner</div>
    <div class="bracket-match-box" data-box="winner">
      <div class="bracket-row ${champ?'winner':'pending'}"><span class="name">${champ ? escapeHtml(champ) : 'À déterminer'}</span><span class="status">${champ?'🏆':'—'}</span></div>
    </div>
  </div>`;

  return `<div class="card">
    <h1>🏆 Grille du tournoi</h1>
    <p>${p.participants.length} participants${p.artistMode?' — mode tournoi par artiste':''}. Fais défiler horizontalement pour voir toute la grille.</p>
    <div class="bracket-wrap">
      <div class="bracket-content" id="bracketContent">
        <svg class="bracket-svg" id="bracketSvg"></svg>
        ${roundsHtml}
      </div>
    </div>
  </div>`;
}
function renderBracketBox(ri, mi, match, nextMatch){
  const p = state.party;
  const isNext = nextMatch && nextMatch.r===ri && nextMatch.m===mi;
  if(!match){
    return `<div class="bracket-match-box" data-box="${ri}-${mi}">
      <div class="bracket-row pending"><span class="name">À déterminer</span><span class="status">—</span></div>
      <div class="bracket-row pending"><span class="name">À déterminer</span><span class="status">—</span></div>
    </div>`;
  }
  const nameA = match.a!=null ? escapeHtml(p.participants[match.a].name) : null;
  const nameB = match.b!=null ? escapeHtml(p.participants[match.b].name) : null;
  const isBye = match.a==null || match.b==null;
  if(match.played){
    if(isBye){
      const winnerName = escapeHtml(p.participants[match.winner].name);
      return `<div class="bracket-match-box" data-box="${ri}-${mi}">
        <div class="bracket-row winner"><span class="name">${winnerName}</span><span class="status">🏆</span></div>
        <div class="bracket-row pending"><span class="name">Bye</span><span class="status">—</span></div>
      </div>`;
    }
    const winnerIsA = match.winner===match.a;
    return `<div class="bracket-match-box" data-box="${ri}-${mi}">
      <div class="bracket-row ${winnerIsA?'winner':'loser'}"><span class="name">${nameA}</span><span class="status">${winnerIsA?'🏆':'—'}</span></div>
      <div class="bracket-row ${!winnerIsA?'winner':'loser'}"><span class="name">${nameB}</span><span class="status">${!winnerIsA?'🏆':'—'}</span></div>
    </div>`;
  }
  return `<div class="bracket-match-box ${isNext?'next':''}" data-box="${ri}-${mi}">
    <div class="bracket-row"><span class="name">${nameA || '?'}</span><span class="status">—</span></div>
    <div class="bracket-row"><span class="name">${nameB || '?'}</span><span class="status">—</span></div>
    ${isNext ? `<div class="launch-row"><button class="btn small" style="width:100%;" onclick="launchMatch(${ri},${mi})">Lancer</button></div>` : ''}
  </div>`;
}
function layoutBracket(){
  const content = document.getElementById('bracketContent');
  const svg = document.getElementById('bracketSvg');
  if(!content || !svg) return;
  const cols = content.querySelectorAll('.bracket-round-col');
  if(!cols.length) return;
  cols.forEach(c=>{ c.style.height='auto'; });
  const maxH = Math.max(...Array.from(cols).map(c=>c.offsetHeight));
  cols.forEach(c=>{ c.style.height = maxH+'px'; });

  const contentRect = content.getBoundingClientRect();
  const totalW = content.scrollWidth, totalH = content.scrollHeight;
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  svg.style.width = totalW+'px';
  svg.style.height = totalH+'px';

  function boxRect(key){
    const el = content.querySelector(`[data-box="${key}"]`);
    if(!el) return null;
    const r = el.getBoundingClientRect();
    return {
      left: r.left - contentRect.left + content.scrollLeft,
      right: r.right - contentRect.left + content.scrollLeft,
      centerY: (r.top - contentRect.top + content.scrollTop) + r.height/2
    };
  }

  const totalRoundsCount = Math.log2(state.party.bracketSize);
  const color = 'rgba(255,255,255,.28)';
  let lines = '';
  for(let ri=0; ri<totalRoundsCount; ri++){
    const matchesInRound = state.party.bracketSize / Math.pow(2, ri+1);
    if(matchesInRound===1){
      // final round: single line straight into the Winner box
      const a = boxRect(`${ri}-0`);
      const next = boxRect('winner');
      if(a && next){
        const midX = a.right + (next.left - a.right)/2;
        lines += `<line x1="${a.right}" y1="${a.centerY}" x2="${midX}" y2="${a.centerY}" stroke="${color}" stroke-width="2"/>`;
        lines += `<line x1="${midX}" y1="${a.centerY}" x2="${next.left}" y2="${next.centerY}" stroke="${color}" stroke-width="2"/>`;
      }
      continue;
    }
    for(let mi=0; mi<matchesInRound; mi+=2){
      const a = boxRect(`${ri}-${mi}`);
      const b = boxRect(`${ri}-${mi+1}`);
      const next = boxRect(`${ri+1}-${mi/2}`);
      if(!a || !b || !next) continue;
      const midX = a.right + (next.left - a.right)/2;
      const midY = (a.centerY + b.centerY)/2;
      lines += `<line x1="${a.right}" y1="${a.centerY}" x2="${midX}" y2="${a.centerY}" stroke="${color}" stroke-width="2"/>`;
      lines += `<line x1="${b.right}" y1="${b.centerY}" x2="${midX}" y2="${b.centerY}" stroke="${color}" stroke-width="2"/>`;
      lines += `<line x1="${midX}" y1="${a.centerY}" x2="${midX}" y2="${b.centerY}" stroke="${color}" stroke-width="2"/>`;
      lines += `<line x1="${midX}" y1="${midY}" x2="${next.left}" y2="${next.centerY}" stroke="${color}" stroke-width="2"/>`;
    }
  }
  svg.innerHTML = lines;
}
function renderTournamentChampion(){
  const champ = state.party.participants[state.party.championIdx];
  return `<div class="card">
    <h1 style="text-align:center;">🏆 ${escapeHtml(champ.name)} remporte le tournoi !</h1>
    <p style="text-align:center;">${state.party.participants.length} participants, ${state.party.rounds.length} rounds de tournoi.</p>
    <button class="btn" onclick="resetGame()">Nouvelle soirée</button>
  </div>`;
}

/* ---------- ROI DE LA COLLINE (hôte, local) ---------- */
function renderKingSetup(){
  const k = state.king;
  const kingSet = k.participants.length>0;
  const queueChips = k.queue.map((idx,i)=>`
    <div class="chip"><span>${i+1}. ${escapeHtml(k.participants[idx].name)}</span><button onclick="removeChallengerSetup(${i})">✕</button></div>
  `).join('') || `<div class="theme-empty">Aucun challenger ajouté pour l'instant</div>`;

  return `<div class="card">
    <h1>Roi de la colline — configuration</h1>
    <p>Un roi affronte des challengers un par un ; le perdant de chaque défi repasse en bout de file pour retenter sa chance plus tard (personne n'est jamais éliminé). Jusqu'à 5 challengers en file.</p>

    ${!kingSet ? `
      <label>Nom du roi de départ</label>
      <input type="text" id="kingNameInput" placeholder="Ex : Louis" onkeydown="if(event.key==='Enter'){event.preventDefault();setInitialKing();}">
      <button class="btn secondary" onclick="setInitialKing()">Couronner ce roi 👑</button>
    ` : `
      <div class="player-tag p1">👑 ${escapeHtml(k.participants[0].name)}</div>
      <label>Nom du challenger</label>
      <input type="text" id="challengerNameInput" placeholder="Ex : Bob" ${k.queue.length>=5?'disabled':''} onkeydown="if(event.key==='Enter'){event.preventDefault();addChallengerSetup();}">
      <button class="btn secondary" ${k.queue.length>=5?'disabled':''} onclick="addChallengerSetup()">+ Ajouter à la file</button>
      <div style="margin-top:14px;">${queueChips}</div>
    `}

    ${renderGameSettingsDetails({kingHill:true})}

    ${kingSet ? `<button class="btn" ${k.queue.length<1?'disabled':''} onclick="startKingHill()">Lancer la colline (${k.queue.length} challenger${k.queue.length>1?'s':''})</button>
    ${k.queue.length<1?'<div class="error-text">Ajoute au moins 1 challenger.</div>':''}` : ''}
  </div>`;
}
function setInitialKing(){
  const input = document.getElementById('kingNameInput');
  const name = input.value.trim();
  if(!name) return;
  state.king.participants = [{name}];
  render();
}
function addChallengerSetup(){
  if(state.king.queue.length>=5) return;
  const input = document.getElementById('challengerNameInput');
  const name = input.value.trim();
  if(!name) return;
  const idx = state.king.participants.length;
  state.king.participants.push({name});
  state.king.queue.push(idx);
  render();
}
function removeChallengerSetup(i){ state.king.queue.splice(i,1); render(); }
function startKingHill(){
  if(state.king.queue.length<1) return;
  state.king.kingIdx = 0;
  state.king.streak = 0;
  if(state.wheelEnabled) primeThemesPoolFromLibrary();
  state.screen = 'kingView';
  render();
}
function renderKingView(){
  const k = state.king;
  const kingName = k.participants[k.kingIdx].name;
  const queueHtml = k.queue.map((idx,i)=>`
    <div class="chip"><span>${i+1}. ${escapeHtml(k.participants[idx].name)}</span>${i===0?'<button class="btn small" onclick="launchKingMatch()">Défier</button>':'<span style="color:var(--muted); font-size:12.5px;">En attente</span>'}</div>
  `).join('') || `<div class="theme-empty">File vide</div>`;
  const historyHtml = k.history.slice().reverse().map(h=>`
    <div class="recap-item"><span>${escapeHtml(h.challenger)} défie ${escapeHtml(h.king)}</span><b>${escapeHtml(h.winner)} 🏆</b></div>
  `).join('');

  return `<div class="card">
    <h1>👑 Roi de la colline</h1>
    <div class="result-winner" style="padding:4px 0 14px;">
      <div class="big">👑</div>
      <div class="name">${escapeHtml(kingName)}</div>
      <div style="color:var(--muted); font-size:13px; margin-top:2px;">${k.streak} / ${k.roundsToWinHill} victoire${k.streak>1?'s':''} d'affilée pour devenir grand vainqueur</div>
      <div style="color:var(--muted); font-size:12px; margin-top:2px;">Format des défis : ${k.matchFormat==='bo1' ? '1 son chacun' : 'Best of 3'}</div>
    </div>

    <h3>File des challengers</h3>
    <p style="margin-top:-8px;">Le perdant d'un défi repasse en bout de file (personne n'est éliminé).</p>
    ${queueHtml}

    <details class="settings">
      <summary>Ajouter un challenger</summary>
      <input type="text" id="challengerNameInput2" placeholder="Ex : Fred" ${k.queue.length>=5?'disabled':''} onkeydown="if(event.key==='Enter'){event.preventDefault();addChallengerLive();}">
      <button class="btn secondary" ${k.queue.length>=5?'disabled':''} onclick="addChallengerLive()">+ Ajouter</button>
      ${k.queue.length>=5?'<div class="error-text">File pleine (5 max).</div>':''}
    </details>

    ${k.history.length ? `<h3 style="margin-top:16px;">Historique</h3>${historyHtml}` : ''}
  </div>`;
}
function addChallengerLive(){
  if(state.king.queue.length>=5) return;
  const input = document.getElementById('challengerNameInput2');
  const name = input.value.trim();
  if(!name) return;
  const idx = state.king.participants.length;
  state.king.participants.push({name});
  state.king.queue.push(idx);
  render();
}
function launchKingMatch(){
  const k = state.king;
  if(!k.queue.length) return;
  const challengerIdx = k.queue[0];
  state.p1Name = k.participants[k.kingIdx].name;
  state.p2Name = k.participants[challengerIdx].name;
  // chaque défi vs le roi est un mini-match indépendant : 1 son chacun (bo1) ou 2 victoires sur 3 (bo3)
  state.totalRounds = k.matchFormat==='bo3' ? 3 : 1;
  state.scoreP1=0; state.scoreP2=0; state.round=1; state.history=[];
  computeSpecialRoundsPlan(state.totalRounds);
  beginRound();
}
function finishKingMatch(){
  const k = state.king;
  const winnerPlayer = state.scoreP1 > state.scoreP2 ? 'p1' : 'p2';
  const challengerIdx = k.queue.shift();
  const kingName = k.participants[k.kingIdx].name;
  const challengerName = k.participants[challengerIdx].name;
  if(winnerPlayer==='p1'){
    // le roi défend sa couronne : le challenger repasse en bout de file (jamais éliminé)
    k.streak++;
    k.queue.push(challengerIdx);
    k.history.push({king:kingName, challenger:challengerName, winner:kingName});
    if(k.streak >= k.roundsToWinHill){
      state.screen = 'kingChampion';
      render();
      return;
    }
  } else {
    // le challenger détrône le roi : l'ancien roi repasse aussi en bout de file (jamais éliminé)
    k.queue.push(k.kingIdx);
    k.kingIdx = challengerIdx;
    k.streak = 1;
    k.history.push({king:kingName, challenger:challengerName, winner:challengerName});
    if(k.streak >= k.roundsToWinHill){
      state.screen = 'kingChampion';
      render();
      return;
    }
  }
  state.screen = 'kingView';
  render();
}
function renderKingChampion(){
  const k = state.king;
  const kingName = k.participants[k.kingIdx].name;
  const historyHtml = k.history.slice().reverse().map(h=>`
    <div class="recap-item"><span>${escapeHtml(h.challenger)} défie ${escapeHtml(h.king)}</span><b>${escapeHtml(h.winner)} 🏆</b></div>
  `).join('');
  return `<div class="card">
    <h1 style="text-align:center;">👑 ${escapeHtml(kingName)} devient grand vainqueur de la colline !</h1>
    <p style="text-align:center;">${k.streak} victoires d'affilée sur la colline — objectif de ${k.roundsToWinHill} atteint.</p>
    <h3>Historique des défis</h3>
    ${historyHtml}
    <button class="btn" onclick="resetGame()">Nouvelle colline</button>
  </div>`;
}

/* ---------- ROUND FLOW ---------- */
function beginRound(){
  state.currentTheme = null;
  state.submissions = {p1:null, p2:null};
  state.submitStage = 'p1';
  state.votes = {A:0,B:0};
  state.playbackIndex = 0;
  state.hostPickOpen = false;
  state.currentSpecialEffect = (state.specialRoundsPlan||[]).includes(state.round) ? pickSpecialEffect() : null;
  if(state.currentSpecialEffect && state.currentSpecialEffect.key==='theme' && state.themesLibrary.length){
    state.currentTheme = state.themesLibrary[Math.floor(Math.random()*state.themesLibrary.length)];
  }
  state.screen = state.wheelEnabled && state.themesPool.length>=2 ? 'wheelSpin' : 'handoff';
  render();
}

function renderWheelSpin(){
  const themes = state.themesPool;
  const n = themes.length;
  const seg = 360/n;
  const gradientStops = themes.map((t,i)=>{
    const c = PALETTE[i % PALETTE.length];
    return `${c} ${i*seg}deg ${(i+1)*seg}deg`;
  }).join(', ');
  return `<div class="card">
    ${state.gameMode==='battle' ? battleHeaderBar() : state.gameMode==='chain' ? chainHeaderBar() : headerBar()}
    <h2 style="text-align:center;">La roue tourne...</h2>
    <p style="text-align:center;">Le thème imposé pour ce round va être tiré au sort.</p>
    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheelEl" style="background:conic-gradient(${gradientStops}); transform:rotate(${state.wheelRotation}deg);"></div>
      <div class="wheel-center">🎯</div>
    </div>
    <div id="themeRevealBox" style="min-height:30px;"></div>
    <button class="btn" id="spinBtn" onclick="spinWheel()">Tourner la roue</button>
    <button class="btn secondary" onclick="skipWheel()">Passer sans thème ce round</button>
  </div>`;
}
function spinWheel(){
  const themes = state.themesPool;
  const n = themes.length;
  const seg = 360/n;
  const chosenIndex = Math.floor(Math.random()*n);
  const centerAngle = chosenIndex*seg + seg/2;
  const targetMod = (360 - centerAngle) % 360;
  const currentMod = ((state.wheelRotation % 360)+360)%360;
  const diff = (targetMod - currentMod + 360) % 360;
  state.wheelRotation += 5*360 + diff;
  document.getElementById('wheelEl').style.transform = `rotate(${state.wheelRotation}deg)`;
  document.getElementById('spinBtn').disabled = true;
  setTimeout(()=>{
    state.currentTheme = themes[chosenIndex];
    themes.splice(chosenIndex,1);
    document.getElementById('themeRevealBox').innerHTML = `<div class="theme-reveal">🎲 ${escapeHtml(state.currentTheme)}</div>`;
    document.getElementById('spinBtn').outerHTML = `<button class="btn" onclick="proceedAfterWheel()">Continuer</button>`;
  }, 4100);
}
function postWheelScreen(){ return state.gameMode==='battle' ? 'battleHandoff' : state.gameMode==='chain' ? 'chainHandoff' : 'handoff'; }
function skipWheel(){ state.currentTheme=null; state.screen = postWheelScreen(); render(); }

async function performSearch(query){

    state.searchError = results.length ? '' : 'Aucun résultat.';
