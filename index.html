async function searchYouTube(query){
  const key = state.apiKeys.youtube;
  if(!key) throw new Error("Ajoute une clé API YouTube dans les réglages (écran précédent), ou passe en mode Lien direct.");
  const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=6&q=${encodeURIComponent(query)}&key=${encodeURIComponent(key)}`);
  if(!res.ok){
    let reason = '';
    try{
      const errData = await res.json();
      reason = (errData.error && (errData.error.message || (errData.error.errors && errData.error.errors[0] && errData.error.errors[0].reason))) || '';
    }catch(e){ /* réponse non-JSON, on garde le message générique */ }
    throw new Error(reason ? `Erreur YouTube (${res.status}) : ${reason}` : `Clé API YouTube invalide ou quota dépassé (code ${res.status}).`);
  }
  const data = await res.json();
  return (data.items||[]).map(it=>({
    source:'youtube', id:it.id.videoId, title:it.snippet.title, subtitle:it.snippet.channelTitle,
    thumbnail: it.snippet.thumbnails && (it.snippet.thumbnails.default||{}).url
  }));
}
async function getSpotifyToken(){
  if(state.spotifyToken && Date.now() < state.spotifyTokenExpiry) return state.spotifyToken;
  const {spotifyId, spotifySecret} = state.apiKeys;
  if(!spotifyId || !spotifySecret) throw new Error("Ajoute un Client ID + Secret Spotify dans les réglages, ou passe en mode Lien direct.");
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method:'POST',
    headers:{
      'Content-Type':'application/x-www-form-urlencoded',
      'Authorization':'Basic '+btoa(spotifyId+':'+spotifySecret)
    },
    body:'grant_type=client_credentials'
  });
  if(!res.ok) throw new Error('Identifiants Spotify invalides.');
  const data = await res.json();
  state.spotifyToken = data.access_token;
  state.spotifyTokenExpiry = Date.now() + ((data.expires_in||3600)-60)*1000;
  return state.spotifyToken;
}
async function searchSpotify(query){
  const token = await getSpotifyToken();
  const res = await fetch(`https://api.spotify.com/v1/search?type=track&limit=6&q=${encodeURIComponent(query)}`, {
    headers:{'Authorization':'Bearer '+token}
  });
  if(!res.ok) throw new Error('Recherche Spotify indisponible.');
  const data = await res.json();
  return ((data.tracks && data.tracks.items) || []).map(t=>({
    source:'spotify', id:t.id, title:t.name, subtitle:(t.artists||[]).map(a=>a.name).join(', '),
    thumbnail: t.album && t.album.images && t.album.images[t.album.images.length-1] && t.album.images[t.album.images.length-1].url
  }));
}

/* ---------- CONNEXION SPOTIFY (OAuth Authorization Code + PKCE) ----------
   Flux distinct du token "Client Credentials" ci-dessus (qui sert uniquement à la recherche/aperçu 30s).
   Ici on connecte le compte Spotify de l'hôte (Premium requis) pour piloter un vrai lecteur intégré
   via le Web Playback SDK. Aucun Client Secret n'est nécessaire pour ce flux : PKCE le remplace par
   un secret à usage unique généré côté navigateur. Redirige vers Spotify puis revient sur cette même
   page (redirect URI = l'URL exacte de déploiement, ex. https://willsimp99.github.io/SONGWARS/). */
const SPOTIFY_AUTH_STORAGE_KEY = 'musicBattle.spotifyAuth';
const SPOTIFY_PKCE_VERIFIER_KEY = 'musicBattle.spotifyPkceVerifier';
const SPOTIFY_PKCE_STATE_KEY = 'musicBattle.spotifyPkceState';
const SPOTIFY_SCOPES = 'streaming user-read-email user-read-private user-modify-playback-state';
function spotifyRedirectUri(){
  return location.origin + location.pathname;
}
function generateRandomString(len){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  let out = '';
  for(let i=0;i<len;i++) out += chars[bytes[i] % chars.length];
  return out;
}
async function sha256Base64Url(str){
  const data = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('SHA-256', data);
  let binary = '';
  const bytes = new Uint8Array(digest);
  for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function copySpotifyRedirectUri(){
  const uri = spotifyRedirectUri();
  const msg = document.getElementById('spRedirectCopyMsg');
  const done = ()=>{ if(msg){ msg.textContent = '✓ Copié !'; setTimeout(()=>{ if(msg) msg.textContent=''; }, 2000); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(uri).then(done).catch(()=>{
      if(msg) msg.textContent = "Copie automatique indisponible — sélectionne le texte manuellement.";
    });
  } else if(msg){
    msg.textContent = "Copie automatique indisponible — sélectionne le texte manuellement.";
  }
}
async function connectSpotifyAccount(){
  const clientId = state.apiKeys.spotifyId;
  if(!clientId){
    const msg = document.getElementById('spotifyAuthMsg');
    if(msg) msg.innerHTML = '<div class="error-text">Ajoute d\'abord un Client ID Spotify ci-dessus.</div>';
    return;
  }
  const verifier = generateRandomString(64);
  const challenge = await sha256Base64Url(verifier);
  const oauthState = generateRandomString(16);
  try{
    sessionStorage.setItem(SPOTIFY_PKCE_VERIFIER_KEY, verifier);
    sessionStorage.setItem(SPOTIFY_PKCE_STATE_KEY, oauthState);
  }catch(e){ /* stockage indisponible — la validation CSRF au retour échouera proprement */ }
  const params = new URLSearchParams({
    client_id: clientId,
    response_type: 'code',
    redirect_uri: spotifyRedirectUri(),
    scope: SPOTIFY_SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge,
    state: oauthState
  });
  location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}
// Appelé une fois au chargement de la page : si l'URL contient ?code=...&state=... (retour de Spotify),
// échange le code contre les tokens puis nettoie l'URL. Ne fait rien si l'utilisateur n'a pas initié de connexion.
async function handleSpotifyAuthRedirect(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const returnedState = params.get('state');
  const error = params.get('error');
  if(!code && !error) return;
  history.replaceState(null, '', location.pathname);
  if(error) return;
  let savedVerifier = null, savedState = null;
  try{
    savedVerifier = sessionStorage.getItem(SPOTIFY_PKCE_VERIFIER_KEY);
    savedState = sessionStorage.getItem(SPOTIFY_PKCE_STATE_KEY);
  }catch(e){ /* ignore */ }
  if(!savedVerifier || !returnedState || returnedState!==savedState) return;
  try{
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        grant_type:'authorization_code',
        code,
        redirect_uri: spotifyRedirectUri(),
        client_id: state.apiKeys.spotifyId,
        code_verifier: savedVerifier
      }).toString()
    });
    if(!res.ok) throw new Error("Échange du code d'autorisation Spotify échoué.");
    const data = await res.json();
    state.spotifyAuth = {
      accessToken: data.access_token,
      refreshToken: data.refresh_token,
      expiresAt: Date.now() + ((data.expires_in||3600)-60)*1000
    };
    saveSpotifyAuth();
  }catch(e){
    console.error(e);
  }finally{
    try{
      sessionStorage.removeItem(SPOTIFY_PKCE_VERIFIER_KEY);
      sessionStorage.removeItem(SPOTIFY_PKCE_STATE_KEY);
    }catch(e){ /* ignore */ }
  }
}
async function refreshSpotifyAuthIfNeeded(){
  if(!state.spotifyAuth.refreshToken) throw new Error('Compte Spotify non connecté.');
  if(state.spotifyAuth.accessToken && Date.now() < state.spotifyAuth.expiresAt) return state.spotifyAuth.accessToken;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams({
      grant_type:'refresh_token',
      refresh_token: state.spotifyAuth.refreshToken,
      client_id: state.apiKeys.spotifyId
    }).toString()
  });
  if(!res.ok) throw new Error('Session Spotify expirée — reconnecte-toi.');
  const data = await res.json();
  state.spotifyAuth.accessToken = data.access_token;
  if(data.refresh_token) state.spotifyAuth.refreshToken = data.refresh_token;
  state.spotifyAuth.expiresAt = Date.now() + ((data.expires_in||3600)-60)*1000;
  saveSpotifyAuth();
  return state.spotifyAuth.accessToken;
}
function disconnectSpotifyAccount(){
  state.spotifyAuth = {accessToken:null, refreshToken:null, expiresAt:0};
  spPlayer = null; spDeviceId = null; spCurrentTrackId = null;
  try{ localStorage.removeItem(SPOTIFY_AUTH_STORAGE_KEY); }catch(e){ /* ignore */ }
  render();
}
function saveSpotifyAuth(){
  try{ localStorage.setItem(SPOTIFY_AUTH_STORAGE_KEY, JSON.stringify(state.spotifyAuth)); }catch(e){ /* ignore */ }
}
function loadSpotifyAuth(){
  try{
    const raw = localStorage.getItem(SPOTIFY_AUTH_STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.spotifyAuth = {
        accessToken: parsed.accessToken || null,
        refreshToken: parsed.refreshToken || null,
        expiresAt: parsed.expiresAt || 0
      };
    }
  }catch(e){ /* ignore */ }
}

/* ---------- LECTEUR SPOTIFY CUSTOM (Web Playback SDK — nécessite un compte connecté + Premium) ----------
   Même logique de montage/démontage que le lecteur YouTube custom : tout se passe dans afterRender()
   en ciblant #spPlayerCard, jamais dans render() lui-même (voir handleSpotifyCustomPlayer). Le player
   Spotify lui-même (une fois créé) est persistant — on ne le recrée pas à chaque changement de morceau,
   seulement au premier montage, puis on appelle juste l'API "play" avec le nouvel URI de piste. */
function loadSpotifySdk(){
  if(spSdkPromise) return spSdkPromise;
  spSdkPromise = new Promise(resolve=>{
    if(window.Spotify && window.Spotify.Player){ resolve(); return; }
    const prevCallback = window.onSpotifyWebPlaybackSDKReady;
    window.onSpotifyWebPlaybackSDKReady = () => { if(typeof prevCallback==='function') prevCallback(); resolve(); };
    const tag = document.createElement('script');
    tag.src = 'https://sdk.scdn.co/spotify-player.js';
    document.head.appendChild(tag);
  });
  return spSdkPromise;
}
// Crée le lecteur persistant une seule fois (le connecte au compte de l'hôte) et résout avec son device_id,
// nécessaire pour ensuite lui envoyer des ordres de lecture via l'API Web.
function ensureSpotifyPlayerReady(){
  if(spPlayer && spDeviceId) return Promise.resolve(spDeviceId);
  return loadSpotifySdk().then(()=> new Promise((resolve, reject)=>{
    if(spPlayer && spDeviceId){ resolve(spDeviceId); return; }
    const player = new Spotify.Player({
      name: 'Music Battle',
      getOAuthToken: cb => { refreshSpotifyAuthIfNeeded().then(cb).catch(()=>cb('')); },
      volume: 0.8
    });
    player.addListener('ready', ({device_id})=>{ spDeviceId = device_id; resolve(device_id); });
    player.addListener('not_ready', ()=>{ spDeviceId = null; });
    player.addListener('initialization_error', ({message})=>{ reject(new Error(message || "Le navigateur ne supporte pas le lecteur Spotify.")); });
    player.addListener('authentication_error', ({message})=>{ reject(new Error(message || 'Authentification Spotify invalide — reconnecte-toi.')); });
    player.addListener('account_error', ({message})=>{ reject(new Error(message || "Spotify Premium est requis sur le compte connecté pour la lecture intégrée.")); });
    player.addListener('player_state_changed', handleSpotifyStateChanged);
    player.connect();
    spPlayer = player;
  }));
}
async function playSpotifyTrackById(trackId){
  const note = document.getElementById('spPlayerNote');
  try{
    const deviceId = await ensureSpotifyPlayerReady();
    const token = await refreshSpotifyAuthIfNeeded();
    spCurrentTrackId = trackId;
    spWasNearEnd = false;
    const res = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
      method:'PUT',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify({uris:[`spotify:track:${trackId}`]})
    });
    if(!res.ok && res.status!==204) throw new Error('Lecture Spotify impossible sur ce compte (Premium requis).');
    if(note){ note.style.display='none'; note.textContent=''; }
  }catch(e){
    if(note){ note.textContent = '⚠️ ' + (e.message || 'Erreur du lecteur Spotify.'); note.style.display='block'; }
  }
}
function handleSpotifyStateChanged(pbState){
  if(!pbState) return;
  spLastState = pbState;
  updateSpPlayPauseIcon(!pbState.paused);
  if(!pbState.paused) startSpProgressPolling();
  const dur = pbState.duration || 0;
  const nearEnd = dur>0 && (dur - pbState.position) < 1200;
  if(pbState.paused && pbState.position===0 && spWasNearEnd){
    spWasNearEnd = false;
    onSpotifyPlaybackEnded();
  } else if(nearEnd){
    spWasNearEnd = true;
  }
}
function startSpProgressPolling(){
  if(spProgressHandle) return;
  spProgressHandle = setInterval(()=>{
    if(!spPlayer) return;
    spPlayer.getCurrentState().then(pbState=>{
      if(!pbState){ if(spProgressHandle){ clearInterval(spProgressHandle); spProgressHandle=null; } return; }
      const cur = pbState.position || 0;
      const dur = pbState.duration || 0;
      const fill = document.getElementById('spProgressFill');
      const label = document.getElementById('spTimeLabel');
      if(fill && dur>0) fill.style.width = Math.min(100, (cur/dur)*100) + '%';
      if(label) label.textContent = `${formatTime(Math.floor(cur/1000))} / ${formatTime(Math.floor(dur/1000))}`;
      if(pbState.paused && spProgressHandle){ clearInterval(spProgressHandle); spProgressHandle=null; }
    });
  }, 500);
}
function toggleSpPlayback(){
  if(!spPlayer) return;
  spPlayer.togglePlay();
}
function updateSpPlayPauseIcon(isPlaying){
  const btn = document.getElementById('spPlayPauseBtn');
  if(btn) btn.textContent = isPlaying ? '⏸' : '▶';
}
function seekSpPlayer(evt){
  if(!spPlayer || !spLastState) return;
  const wrap = document.getElementById('spProgressWrap');
  if(!wrap) return;
  const rect = wrap.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (evt.clientX-rect.left)/rect.width));
  const dur = spLastState.duration || 0;
  if(dur>0) spPlayer.seek(dur*ratio);
}
// Même logique d'auto-avance que côté YouTube (voir onYtPlaybackEnded) — pas d'auto-avance en Chaîne Musicale.
function onSpotifyPlaybackEnded(){
  if(spProgressHandle){ clearInterval(spProgressHandle); spProgressHandle=null; }
  const fill = document.getElementById('spProgressFill');
  if(fill) fill.style.width = '100%';
  if(state.screen==='playback'){
    const isLast = (state.playbackIndex||0) >= state.order.length-1;
    isLast ? goToVote() : nextPlaybackTrack();
  } else if(state.screen==='battlePlayback'){
    const b = state.battle;
    const isLast = (b.playbackIndex||0) >= b.playbackOrder.length-1;
    isLast ? goToBattleVote() : nextBattlePlaybackTrack();
  }
}
// Appelé après CHAQUE render() (voir afterRender) : monte/relance le lecteur Spotify custom si l'écran
// actuel contient une carte #spPlayerCard avec un nouveau data-track-id.
function handleSpotifyCustomPlayer(){
  const card = document.getElementById('spPlayerCard');
  if(!card){
    if(spProgressHandle){ clearInterval(spProgressHandle); spProgressHandle=null; }
    return;
  }
  const trackId = card.getAttribute('data-track-id');
  if(!trackId || trackId===spCurrentTrackId) return;
  playSpotifyTrackById(trackId);
}
function renderSearchResultsHtml(){
  if(state.selectedTrack) return '';
  if(state.searchLoading) return `<div class="search-status">Recherche en cours...</div>`;
  if(state.searchError) return `<div class="error-text">${escapeHtml(state.searchError)}</div>`;
  if(!state.searchResults.length) return '';
  return `<div class="search-list">${state.searchResults.map((r,i)=>`
    <div class="search-item" onclick="selectSearchResult(${i})">
      ${r.thumbnail ? `<img src="${escapeHtml(r.thumbnail)}">` : ''}
      <div class="meta"><div class="t">${escapeHtml(r.title)}</div><div class="s">${escapeHtml(r.subtitle||'')}</div></div>
    </div>
  `).join('')}</div>`;
}
function selectSearchResult(i){
  state.selectedTrack = state.searchResults[i];
  state.searchResults = [];
  render();
}

function submitSong(){
  const player = state.submitStage;

  if(state.selectedTrack){
    const t = state.selectedTrack;
    stopTimer();
    state.submissions[player] = {source:t.source, id:t.id, url:null, title:t.title, thumbnail:t.thumbnail};
    advanceAfterSubmit();
    return;
  }

  // link mode
  const urlInput = document.getElementById('trackUrl');
  const url = urlInput ? urlInput.value.trim() : '';
  const src = state.submitSource;
  const id = src==='youtube' ? extractYouTubeId(url) : extractSpotifyId(url);
  if(!id){
    const err = document.getElementById('urlError');
    if(err) err.style.display='block';
    return;
  }
  stopTimer();
  state.submissions[player] = {source:src, id, url, title:null, thumbnail:null};
  fetchTitle(src, url).then(title=>{
    if(state.submissions[player]) state.submissions[player].title = title;
  });
  advanceAfterSubmit();
}
function advanceAfterSubmit(){
  if(state.submitStage==='p1'){
    state.submitStage='p2';
    state.screen='handoff';
  } else {
    // both submitted -> randomize anonymized order and go to playback (révélation progressive)
    state.order = Math.random()<0.5 ? ['p1','p2'] : ['p2','p1'];
    state.playbackIndex = 0;
    state.screen='playback';
  }
  render();
}
function forfeitCurrentPlayer(){
  const player = state.submitStage;
  state.submissions[player] = {source:null, id:null, url:null, title:'Forfait', thumbnail:null};
  advanceAfterSubmit();
}

/* ---------- TIMER ---------- */
function startTimerIfEnabled(){
  if(!isTimerActiveThisRound()) return;
  state.timerRemaining = effectiveTimerSeconds();
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(()=>{
    state.timerRemaining--;
    const el = document.getElementById('timerDisplay');
    if(el){
      el.textContent = formatTime(state.timerRemaining);
      el.classList.toggle('warn', state.timerRemaining<=10);
    }
    if(state.timerRemaining<=0){
      stopTimer();
      if(state.gameMode==='battle') forfeitCurrentBattlePlayer();
      else if(state.gameMode==='chain') forfeitCurrentChainPlayer();
      else forfeitCurrentPlayer();
    }
  },1000);
}
function stopTimer(){ clearInterval(state.timerHandle); state.timerHandle=null; }
function formatTime(s){ const m=Math.floor(s/60); const sec=String(s%60).padStart(2,'0'); return `${m}:${sec}`; }

// Carte média (YouTube/Spotify/fichier local) pour une soumission — partagée entre le moteur 1v1 et Battle Royale.

  if(sub.source==='youtube'){
    return `<div class="video-card">
      <div class="tag">${label} 🎥</div>
      <div class="yt-custom-player">
        <div id="ytPlayerSlot" class="yt-player-frame" data-video-id="${escapeHtml(sub.id)}"></div>
        <div class="yt-controls">
          <button type="button" class="yt-playpause" id="ytPlayPauseBtn" onclick="toggleYtPlayback()">▶</button>
          <div class="yt-progress-wrap" id="ytProgressWrap" onclick="seekYtPlayer(event)"><div class="yt-progress-fill" id="ytProgressFill"></div></div>
          <div class="yt-time" id="ytTimeLabel">0:00 / 0:00</div>
        </div>
        <div class="error-text" id="ytPlayerNote" style="display:none;"></div>

  }
  if(state.spotifyAuth && state.spotifyAuth.accessToken){
    return `<div class="video-card">

      <div class="yt-custom-player" id="spPlayerCard" data-track-id="${escapeHtml(sub.id)}">
        <div class="sp-art">🎧</div>
        <div class="yt-controls">
          <button type="button" class="yt-playpause" id="spPlayPauseBtn" onclick="toggleSpPlayback()">▶</button>
          <div class="yt-progress-wrap" id="spProgressWrap" onclick="seekSpPlayer(event)"><div class="yt-progress-fill" id="spProgressFill"></div></div>
          <div class="yt-time" id="spTimeLabel">0:00 / 0:00</div>

    <iframe src="${src}" allow="encrypted-media" allowfullscreen></iframe>
  </div>`;
}

/* ---------- LECTEUR YOUTUBE CUSTOM (API IFrame Player — pas de clé requise, script public) ----------
   Remplace le player brut par des contrôles maison (lecture/pause, barre de progression cliquable,
   temps écoulé/restant) et permet d'enchaîner automatiquement vers l'étape suivante une fois la
   vidéo terminée. Monté/démonté depuis afterRender() en ciblant #ytPlayerSlot, jamais depuis render()
   lui-même pour ne pas couper la lecture à chaque re-rendu de l'appli (voir handleYouTubeCustomPlayer). */
function loadYouTubeApi(){
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise(resolve=>{
    if(window.YT && window.YT.Player){ resolve(); return; }
    const prevCallback = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if(typeof prevCallback==='function') prevCallback(); resolve(); };
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  });
  return ytApiPromise;
}
// Appelé après CHAQUE render() (voir afterRender) : monte un lecteur custom si l'écran actuel contient
// un slot YouTube, ou coupe proprement le suivi de progression si on a quitté un tel écran.
function handleYouTubeCustomPlayer(){
  const slot = document.getElementById('ytPlayerSlot');
  if(!slot){
    if(ytProgressHandle){ clearInterval(ytProgressHandle); ytProgressHandle=null; }
    ytPlayer = null;
    return;
  }
  const videoId = slot.getAttribute('data-video-id');
  if(!videoId) return;
  loadYouTubeApi().then(()=>{
    // Chargement async : on revérifie que l'utilisateur est toujours sur ce même écran/morceau avant de monter.
    const freshSlot = document.getElementById('ytPlayerSlot');
    if(!freshSlot || freshSlot.getAttribute('data-video-id')!==videoId) return;
    if(ytProgressHandle){ clearInterval(ytProgressHandle); ytProgressHandle=null; }
    ytPlayer = new YT.Player('ytPlayerSlot', {
      videoId,
      host:'https://www.youtube-nocookie.com',
      playerVars:{ autoplay:1, controls:0, rel:0, modestbranding:1, playsinline:1 },
      events:{
        onReady:(e)=>{ e.target.playVideo(); },
        onStateChange:(e)=>{
          updateYtPlayPauseIcon(e.data===YT.PlayerState.PLAYING);
          if(e.data===YT.PlayerState.PLAYING) startYtProgressPolling();
          if(e.data===YT.PlayerState.ENDED) onYtPlaybackEnded();
        },
        onError:(e)=>{
          // 101/150 : intégration désactivée par le créateur. 153 : referrer bloqué (voir la balise <meta name="referrer">
          // en tête de fichier — si l'app tourne en file:// ce cas peut rester impossible à éviter côté navigateur).
          const messages = {2:'Lien vidéo invalide.', 5:'Erreur du lecteur HTML5.', 100:'Vidéo introuvable ou privée.',
            101:"Le créateur a désactivé l'intégration de cette vidéo ailleurs que sur YouTube.",
            150:"Le créateur a désactivé l'intégration de cette vidéo ailleurs que sur YouTube.",
            153:"Erreur de configuration du lecteur (souvent lié au referrer bloqué en file:// — ouvre le fichier via un serveur local, ou utilise le lien direct)."};
          const note = document.getElementById('ytPlayerNote');
          if(note){ note.textContent = '⚠️ ' + (messages[e.data] || 'Cette vidéo ne peut pas être lue ici.') + ' Utilise "Changer de morceau" pour en choisir une autre.'; note.style.display='block'; }
        }
      }
    });
  });
}
function startYtProgressPolling(){
  if(ytProgressHandle) return;
  ytProgressHandle = setInterval(()=>{
    if(!ytPlayer || typeof ytPlayer.getCurrentTime!=='function') return;
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    const fill = document.getElementById('ytProgressFill');
    const label = document.getElementById('ytTimeLabel');
    if(fill && dur>0) fill.style.width = Math.min(100, (cur/dur)*100) + '%';
    if(label) label.textContent = `${formatTime(Math.floor(cur))} / ${formatTime(Math.floor(dur))}`;
  }, 500);
}
function toggleYtPlayback(){
  if(!ytPlayer || typeof ytPlayer.getPlayerState!=='function') return;
  ytPlayer.getPlayerState()===YT.PlayerState.PLAYING ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
}
function updateYtPlayPauseIcon(isPlaying){
  const btn = document.getElementById('ytPlayPauseBtn');
  if(btn) btn.textContent = isPlaying ? '⏸' : '▶';
}
function seekYtPlayer(evt){
  if(!ytPlayer || typeof ytPlayer.getDuration!=='function') return;
  const wrap = document.getElementById('ytProgressWrap');
  if(!wrap) return;
  const rect = wrap.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (evt.clientX-rect.left)/rect.width));
  const dur = ytPlayer.getDuration() || 0;
  if(dur>0) ytPlayer.seekTo(dur*ratio, true);
}
// Enchaîne automatiquement vers l'étape suivante quand la vidéo se termine — uniquement sur les écrans
// d'écoute pure (Duel/Soirée/Roi et Battle Royale). En Chaîne Musicale on laisse la main : la personne doit
// noter délibérément le lien avant de continuer, l'auto-avance n'aurait pas de sens là-bas.
function onYtPlaybackEnded(){
  if(ytProgressHandle){ clearInterval(ytProgressHandle); ytProgressHandle=null; }
  const fill = document.getElementById('ytProgressFill');
  if(fill) fill.style.width = '100%';
  if(state.screen==='playback'){
    const isLast = (state.playbackIndex||0) >= state.order.length-1;
    isLast ? goToVote() : nextPlaybackTrack();
  } else if(state.screen==='battlePlayback'){
    const b = state.battle;
    const isLast = (b.playbackIndex||0) >= b.playbackOrder.length-1;
    isLast ? goToBattleVote() : nextBattlePlaybackTrack();
  }
}

/* ---------- PLAYBACK ---------- */
function renderPlayback(){
  const idx = state.playbackIndex || 0;
  const p = state.order[idx];
  const label = idx===0 ? 'Morceau A' : 'Morceau B';
  const sub = state.submissions[p];
  const isLast = idx >= state.order.length - 1;

  return `<div class="card">
    ${headerBar()}
    <h2>Écoute des morceaux</h2>
    <div class="playback-progress">Morceau ${idx+1} / ${state.order.length}</div>
    <p>Révélation progressive : un morceau à la fois, anonymisé, pour garder l'attention sur chacun avant de voter.</p>
    ${submissionMediaCardHtml(sub, label)}
    <button class="btn" onclick="${isLast ? 'goToVote()' : 'nextPlaybackTrack()'}">${isLast ? 'Ouvrir le vote' : 'Morceau suivant →'}</button>
  </div>`;
}
function nextPlaybackTrack(){
  state.playbackIndex = (state.playbackIndex||0) + 1;
  render();
}
function goToVote(){ state.screen='vote'; render(); }

/* ---------- VOTE (simulated) ---------- */
function renderVote(){
  const totalVotes = state.votes.A + state.votes.B;
  const noVeto = state.currentSpecialEffect && state.currentSpecialEffect.key==='noveto';
  return `<div class="card">
    ${headerBar()}
    ${specialRoundBannerHtml()}
    <h2>Vote en local</h2>
    <p>Fais passer le téléphone : chaque personne tape une fois sur le morceau qu'elle préfère. Le décompte reste caché jusqu'à la clôture, pour ne pas influencer les votes suivants.</p>

    <button class="vote-tap-btn a" id="voteBtnA" onclick="castVote('A')">🎧 Voter Morceau A</button>
    <button class="vote-tap-btn b" id="voteBtnB" onclick="castVote('B')">🎧 Voter Morceau B</button>
    <div class="vote-feedback" id="voteFeedback"></div>

    <div class="vote-count-note" id="voteCountNote">🗳️ ${totalVotes} vote${totalVotes>1?'s':''} enregistré${totalVotes>1?'s':''} au total — détail caché jusqu'à la clôture</div>

    <button class="btn" onclick="closeVote()">Clôturer le vote et révéler le résultat</button>

    ${noVeto ? '' : `<details class="settings" ${state.hostPickOpen?'open':''} ontoggle="state.hostPickOpen=this.open;">
      <summary>👑 Option hôte — trancher directement</summary>
      <p class="settings-hint">Pour départager toi-même sans attendre les votes (pratique si tu juges seul, ou pour trancher rapidement). Choisir ici clôture le vote immédiatement.</p>
      <div class="row">
        <button class="btn secondary" style="flex:1;" onclick="hostPickWinner('A')">🏆 Morceau A</button>
        <button class="btn secondary" style="flex:1;" onclick="hostPickWinner('B')">🏆 Morceau B</button>
      </div>
    </details>`}
  </div>`;
}
function castVote(choice){
  const btnA = document.getElementById('voteBtnA');
  const btnB = document.getElementById('voteBtnB');
  const feedback = document.getElementById('voteFeedback');
  if(btnA) btnA.disabled = true;
  if(btnB) btnB.disabled = true;
  state.votes[choice]++;
  if(feedback){ feedback.textContent = '✓ Merci ! Passe le téléphone à la personne suivante.'; feedback.style.opacity = '1'; }
  setTimeout(()=>{ render(); }, 550);
}
function hostPickWinner(choice){
  const other = choice==='A' ? 'B' : 'A';
  state.votes[choice] = state.votes[other] + 1;
  closeVote();
}
function closeVote(){ state.screen='result'; render(); }

/* ---------- RESULT ---------- */
function renderResult(){
  const isTie = state.votes.A === state.votes.B;
  const winnerLetter = isTie ? null : (state.votes.A>state.votes.B ? 'A':'B');
  const winnerIndex = winnerLetter==='A' ? 0 : winnerLetter==='B' ? 1 : null;
  const winnerPlayer = winnerIndex!==null ? state.order[winnerIndex] : null;
  const effectKey = state.currentSpecialEffect ? state.currentSpecialEffect.key : null;
  const gainedPoints = effectKey==='double' ? 2 : 1;
  if(winnerPlayer==='p1'){ state.scoreP1 += gainedPoints; if(effectKey==='steal') state.scoreP2 = Math.max(0, state.scoreP2-1); }
  if(winnerPlayer==='p2'){ state.scoreP2 += gainedPoints; if(effectKey==='steal') state.scoreP1 = Math.max(0, state.scoreP1-1); }
  const winnerName = winnerPlayer ? (winnerPlayer==='p1'?state.p1Name:state.p2Name) : 'Égalité parfaite — le round va être rejoué';

  const reveals = state.order.map((p,i)=>{
    const label = i===0?'Morceau A':'Morceau B';
    const sub = state.submissions[p];
    const name = p==='p1'?state.p1Name:state.p2Name;
    const won = p===winnerPlayer;
    return `<div class="video-card" style="${won?'border-color:var(--success);':''}">
      <div class="tag">${label} — ${escapeHtml(name)} ${won?'🏆':''}</div>
      <div style="font-weight:700; font-size:14px;">${escapeHtml(sub && sub.title ? sub.title : (sub && sub.url ? '(titre en cours de récupération...)' : 'Aucune soumission'))}</div>
    </div>`;
  }).join('');

  const majority = Math.ceil(state.totalRounds/2);
  const gameDecided = !isTie && (state.scoreP1>=majority || state.scoreP2>=majority);
  const isLastRound = !isTie && state.round>=state.totalRounds;

  if(!isTie) state.history.push({round:state.round, theme:state.currentTheme, winner:winnerName});

  const outcome = isTie ? 'tie' : ((gameDecided || isLastRound) ? 'over' : 'continue');
  const btnLabel = isTie ? '🔁 Rejouer ce round' : ((gameDecided || isLastRound) ? 'Voir le résultat final' : 'Round suivant');

  return `<div class="card">
    ${headerBar()}
    ${specialRoundBannerHtml()}
    <div class="result-winner">
      <div class="big">${winnerPlayer?'🏆':'🤝'}</div>
      <div class="name">${escapeHtml(winnerName)}</div>
    </div>
    ${reveals}
    <button class="btn" onclick="afterResult('${outcome}')">${btnLabel}</button>
  </div>`;
}
function afterResult(outcome){
  if(outcome==='tie'){ beginRound(); return; }
  if(outcome==='over'){
    if(state.gameMode==='party'){ finishPartyMatch(); }
    else if(state.gameMode==='king'){ finishKingMatch(); }
    else { state.screen='gameover'; render(); }
    return;
  }
  state.round++;
  beginRound();
}
function finishPartyMatch(){
  const winnerPlayer = state.scoreP1 > state.scoreP2 ? 'p1' : 'p2';
  const {r,m} = state.party.currentMatch;
  const match = state.party.rounds[r][m];
  match.winner = winnerPlayer==='p1' ? match.a : match.b;
  match.played = true;
  advancePartyBracket();
  state.screen = state.party.championIdx!=null ? 'tournamentChampion' : 'bracketView';
  render();
}

/* ---------- GAME OVER ---------- */
function renderGameOver(){
  const p1Wins = state.scoreP1>state.scoreP2;
  const winnerName = p1Wins?state.p1Name:state.p2Name;
  const recap = state.history.map(h=>`
    <div class="recap-item"><span>Round ${h.round}${h.theme?' — '+escapeHtml(h.theme):''}</span><b>${escapeHtml(h.winner)}</b></div>
  `).join('');
  return `<div class="card">
    <h1 style="text-align:center;">🏆 ${escapeHtml(winnerName)} remporte la partie !</h1>
    <div class="final-score">
      <div class="side"><div class="val" style="color:var(--p1);">${state.scoreP1}</div><div>${escapeHtml(state.p1Name)}</div></div>
      <div class="vs">—</div>
      <div class="side"><div class="val" style="color:var(--p2);">${state.scoreP2}</div><div>${escapeHtml(state.p2Name)}</div></div>
    </div>
    <h3>Récap des rounds</h3>
    ${recap}
    <button class="btn" onclick="resetGame()">Rejouer</button>
  </div>`;
}
function resetGame(){
  Object.assign(state, {
    screen:'modeSelect', gameMode:'battle', round:1, totalRounds:5, scoreP1:0, scoreP2:0, currentTheme:null, wheelRotation:0,
    submitStage:'p1', submissions:{p1:null,p2:null}, votes:{A:0,B:0}, playbackIndex:0, hostPickOpen:false, history:[],
    themesPool:[], wheelEnabled:false, gameSettingsOpen:false,
    specialRoundsCount:0, specialRoundsPlan:[], currentSpecialEffect:null,
    party:{ participants:[], artistMode:false, rounds:[], bracketSize:0, championIdx:null, currentMatch:null },
    king:{ kingIdx:null, participants:[], queue:[], streak:0, history:[], roundsToWinHill:10, matchFormat:'bo1' },
    battle:{ players:[], scores:[], submitOrder:[], submitStep:0, submissions:[], playbackOrder:[], playbackIndex:0, ballot:[], ballotLocked:false, roundPoints:[], totalBallots:0, hostPickOpen:false },
    chain:{ players:[], log:[], ratingSelected:null }, chainLinkDraft:''
  });
  render();
}

/* ---------- HELPERS ---------- */
function extractYouTubeId(url){
  try{
    const u = new URL(url.trim());
    let host = u.hostname.replace('www.','');
    if(host==='youtu.be') return u.pathname.slice(1).split('/')[0] || null;
    if(host==='m.youtube.com' || host==='youtube.com'){
      if(u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2] || null;
      if(u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2] || null;
      const v = u.searchParams.get('v');
      if(v) return v;
    }
    return null;
  }catch(e){ return null; }
}
function extractSpotifyId(url){
  try{
    if(url.trim().startsWith('spotify:track:')) return url.trim().split(':')[2] || null;
    const u = new URL(url.trim());
    if(!u.hostname.replace('www.','').includes('spotify.com')) return null;
    const parts = u.pathname.split('/').filter(Boolean); // e.g. ['track','ID'] or ['intl-fr','track','ID']
    const idx = parts.indexOf('track');
    return idx>=0 ? (parts[idx+1] || null) : null;
  }catch(e){ return null; }
}
async function fetchTitle(source, url){
  try{
    const endpoint = source==='spotify'
      ? `https://open.spotify.com/oembed?url=${encodeURIComponent(url)}`
      : `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
    const res = await fetch(endpoint);
    if(!res.ok) throw new Error();
    const data = await res.json();
    return data.title || null;
  }catch(e){ return null; }
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- CLÉS API — mémorisées uniquement dans ce navigateur (jamais dans ce fichier) ---------- */
const API_KEYS_STORAGE_KEY = 'musicBattle.apiKeys';
function saveApiKeys(){
  try{
    localStorage.setItem(API_KEYS_STORAGE_KEY, JSON.stringify(state.apiKeys));
  }catch(e){ /* stockage indisponible (navigation privée, fichier local bloqué...) — pas grave, juste pas mémorisé */ }
}
function loadApiKeys(){
  try{
    const raw = localStorage.getItem(API_KEYS_STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.apiKeys.youtube = parsed.youtube || '';
      state.apiKeys.spotifyId = parsed.spotifyId || '';
      state.apiKeys.spotifySecret = parsed.spotifySecret || '';
    }
  }catch(e){ /* ignore */ }
}
function forgetApiKeys(){
  state.apiKeys = {youtube:'', spotifyId:'', spotifySecret:''};
  state.spotifyToken = null;
  try{ localStorage.removeItem(API_KEYS_STORAGE_KEY); }catch(e){ /* ignore */ }
  render();
}

const THEMES_LIBRARY_STORAGE_KEY = 'musicBattle.wheelThemes';
function saveThemesLibrary(){
  try{
    localStorage.setItem(THEMES_LIBRARY_STORAGE_KEY, JSON.stringify(state.themesLibrary));
  }catch(e){ /* stockage indisponible — pas grave, juste pas mémorisé */ }
}
function loadThemesLibrary(){

      const parsed = JSON.parse(raw);

}
function afterRender(){
  const t = document.getElementById('themeLibInput');
  if(t){ t.focus(); const v=t.value; t.value=''; t.value=v; }
  const s = document.getElementById('searchInput');
  if(s){ s.focus(); const v=s.value; s.value=''; s.value=v; }
  const ls = document.getElementById('libSearchInput');
  if(ls){ ls.focus(); const v=ls.value; ls.value=''; ls.value=v; }
  const pn = document.getElementById('partyNameInput');
  if(pn){ pn.focus(); }
  const kn = document.getElementById('kingNameInput') || document.getElementById('challengerNameInput') || document.getElementById('challengerNameInput2');
  if(kn){ kn.focus(); }
  const bp = document.getElementById('battlePlayerInput');
  if(bp){ bp.focus(); }
  const cp = document.getElementById('chainPlayerInput');
  if(cp){ cp.focus(); }
  if(state.screen==='bracketView'){ layoutBracket(); }
  handleYouTubeCustomPlayer();
  handleSpotifyCustomPlayer();
}
window.addEventListener('resize', ()=>{ if(state.screen==='bracketView') layoutBracket(); });

(async function initApp(){
  loadApiKeys();
  loadThemesLibrary();
  loadSpotifyAuth();
  await handleSpotifyAuthRedirect();
  render();
})();
